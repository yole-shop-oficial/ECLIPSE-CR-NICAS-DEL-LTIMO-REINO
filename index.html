<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <meta name="description" content="ECLIPSE: Crónicas del Último Reino — TCG + RPG de fantasía oscura, offline-first.">
  <title>ECLIPSE: Crónicas del Último Reino</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <noscript>ECLIPSE requiere JavaScript para funcionar.</noscript>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          /* offline-first se endurece en FASE 11; el fallo no bloquea el boot */
        });
      });
    }
  </script>
</body>
</html>
